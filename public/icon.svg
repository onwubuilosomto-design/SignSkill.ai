<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#58CC02"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="#62DC04" stroke="#46A302" stroke-width="8"/>

  <!-- Owl Body -->
  <ellipse cx="256" cy="270" rx="170" ry="180" fill="#58CC02"/>
  <!-- Belly -->
  <ellipse cx="256" cy="305" rx="120" ry="125" fill="#78D82A"/>
  <ellipse cx="256" cy="325" rx="90" ry="90" fill="#8CE23D"/>

  <!-- Belly feather patterns -->
  <path d="M 225 290 Q 256 310 287 290" stroke="#46A302" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 215 330 Q 256 355 297 330" stroke="#46A302" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M 230 370 Q 256 390 282 370" stroke="#46A302" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Wings -->
  <ellipse cx="105" cy="285" rx="42" ry="90" fill="#46A302" transform="rotate(-15 105 285)"/>
  <ellipse cx="407" cy="285" rx="42" ry="90" fill="#46A302" transform="rotate(15 407 285)"/>

  <!-- Feet -->
  <ellipse cx="210" cy="455" rx="35" ry="18" fill="#FF9600"/>
  <ellipse cx="302" cy="455" rx="35" ry="18" fill="#FF9600"/>

  <!-- Eyebrow tufts -->
  <path d="M 155 130 Q 200 95 245 150" stroke="#3C8C00" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M 357 130 Q 312 95 267 150" stroke="#3C8C00" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- Eye Sockets -->
  <circle cx="190" cy="210" r="64" fill="#FFFFFF" stroke="#46A302" stroke-width="10"/>
  <circle cx="322" cy="210" r="64" fill="#FFFFFF" stroke="#46A302" stroke-width="10"/>

  <!-- Pupils -->
  <circle cx="196" cy="210" r="30" fill="#2E384D"/>
  <circle cx="316" cy="210" r="30" fill="#2E384D"/>
  <circle cx="206" cy="200" r="10" fill="#FFFFFF"/>
  <circle cx="326" cy="200" r="10" fill="#FFFFFF"/>

  <!-- Beak -->
  <polygon points="256,235 224,272 288,272" fill="#FF9600"/>
  <polygon points="256,285 232,272 280,272" fill="#E67300"/>

  <!-- Hand Sign Badge (ASL ILY or Wave) in bottom right -->
  <circle cx="395" cy="395" r="70" fill="#FFC800" stroke="#FFFFFF" stroke-width="8"/>
  <text x="395" y="425" font-size="75" text-anchor="middle" font-family="sans-serif">🤟</text>
</svg>
